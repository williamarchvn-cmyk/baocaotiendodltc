    <meta name="description" content="Hệ thống quản lý và báo cáo tiến độ các đại lý tiêu chuẩn Hoa Sen Home đang thi công, hỗ trợ xuất báo cáo PDF chuyên nghiệp." />
    <meta property="og:title" content="Báo cáo Tiến độ Đại lý Tiêu chuẩn" />

    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      // Gọi dữ liệu NGAY khi trang mở, song song với việc tải mã nguồn (không chờ React khởi động).
      (function () {
        var u = '%VITE_SUPABASE_URL%', k = '%VITE_SUPABASE_ANON_KEY%';
        if (u.indexOf('http') !== 0 || !k || k.charAt(0) === '%') return;
        window.__dltcEarly = fetch(
          u + '/rest/v1/agencies?select=id,unit,title,start_date,notes,images&order=created_at.desc&limit=1000',
          { headers: { apikey: k } }
        ).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
      })();
    </script>

    <div id="root"></div>
